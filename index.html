<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Autodiagnóstico SARAS — Microfinanzas</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900;1,400&display=swap');

  :root{
    /* Paleta institucional GGGI (extraída del tema oficial de PowerPoint) */
    --forest-900:#04463d;   /* teal muy oscuro - texto de encabezados */
    --forest-800:#08b89c;   /* teal GGGI (color primario de marca) */
    --forest-700:#069c84;   /* teal hover / oscurecido */
    --moss-500:#367865;     /* verde GGGI secundario (accent5) */
    --moss-300:#8fd8c9;     /* teal claro */
    --sage-100:#e3f5f1;     /* teal muy claro (fondos suaves) */
    --parchment:#f6f8f8;
    --paper:#ffffff;
    --ink:#221f20;          /* tinta institucional GGGI */
    --ink-soft:#5c5c58;
    --gold:#f5b01b;         /* dorado GGGI (accent2) */
    --red:#dc5758;          /* coral GGGI (accent4), usado también como semáforo 0 */
    --orange:#e08a2c;
    --yellow:#f5b01b;
    --green:#367865;
    --line:#dbe4e2;
    --radius:10px;
    --shadow: 0 1px 2px rgba(4,70,61,0.07), 0 6px 20px rgba(4,70,61,0.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--parchment);
    color:var(--ink);
    font-family:'Lato', 'Calibri', 'Segoe UI', sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3,.serif{
    font-family:'Lato','Cambria','Georgia',sans-serif;
    color:var(--forest-900);
    font-weight:700;
    margin:0;
  }
  #app{
    max-width:720px;
    margin:0 auto;
    padding:32px 20px 80px;
  }
  .brand{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
    margin-bottom:28px;
    background:var(--forest-800);
    border-bottom:4px solid var(--gold);
    border-radius:var(--radius) var(--radius) 0 0;
    padding:14px 20px;
  }
  .brand .mark{
    font-family:'Lato',sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.02em;
    color:#ffffff;
  }
  .brand .mark span{color:var(--sage-100); font-weight:400;}
  .brand .tag{
    font-size:12px;
    color:#eafaf6;
    text-align:right;
  }
  .brand .logo{height:26px; width:auto; display:block;}
  .brand-left{display:flex; align-items:center; gap:14px;}

  /* ---------- INTRO ---------- */
  .intro-hero{
    background:var(--forest-800);
    color:var(--paper);
    border-radius:var(--radius);
    padding:40px 32px;
    margin-bottom:28px;
    position:relative;
    overflow:hidden;
  }
  .intro-hero::after{
    content:"";
    position:absolute;
    right:-40px; top:-40px;
    width:200px;height:200px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(180,146,47,0.25), transparent 70%);
  }
  .intro-hero h1{
    color:var(--paper);
    font-size:clamp(26px,4vw,34px);
    line-height:1.15;
    max-width:26ch;
  }
  .hero-underline{
    width:64px; height:4px; background:var(--gold); border-radius:2px; margin-top:12px;
  }
  .intro-hero p{
    color:var(--sage-100);
    max-width:52ch;
    margin-top:14px;
    font-size:15px;
  }
  .stat-row{
    display:flex;
    gap:28px;
    margin-top:26px;
    flex-wrap:wrap;
  }
  .stat-row .stat b{
    display:block;
    font-family:'Lato',sans-serif;
    font-size:26px;
    color:var(--paper);
  }
  .stat-row .stat span{
    font-size:12px;
    color:var(--moss-300);
  }

  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 28px;
    box-shadow:var(--shadow);
    margin-bottom:20px;
  }
  .card h2{font-size:17px; margin-bottom:14px;}
  .module-table{width:100%; border-collapse:collapse; font-size:13.5px;}
  .module-table th{
    text-align:left; font-size:11.5px; text-transform:none; color:var(--ink-soft);
    border-bottom:2px solid var(--forest-800); padding:6px 8px; font-weight:600;
  }
  .module-table td{padding:8px; border-bottom:1px solid var(--line);}
  .module-table td:last-child, .module-table th:last-child{text-align:right;}
  .module-table tr.total-row td{font-weight:700; color:var(--forest-800); border-bottom:none; border-top:1.5px solid var(--forest-800);}
  .level-list{display:flex; flex-direction:column; gap:12px;}
  .level-row{border:1px solid var(--line); border-radius:8px; padding:12px 14px;}
  .level-row-head{display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:14px;}
  .level-row-head .dot{width:12px; height:12px; border-radius:50%;}
  .level-row p{margin:0; font-size:13px; color:var(--ink-soft); line-height:1.5;}
  .level-row.c0{background:#faf1ef;}
  .level-row.c1{background:#fbf3e7;}
  .level-row.c2{background:#fbf7e4;}
  .level-row.c3{background:#eef4ec;}
  .field{margin-bottom:14px;}
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--ink-soft);
    margin-bottom:5px;
    font-weight:600;
  }
  .field input, .field select{
    width:100%;
    padding:9px 11px;
    border:1px solid var(--line);
    border-radius:6px;
    font-size:14.5px;
    font-family:inherit;
    background:var(--parchment);
    color:var(--ink);
  }
  .field input:focus, .field select:focus, textarea:focus{
    outline:2px solid var(--moss-500);
    outline-offset:1px;
  }
  .field-row{display:flex; gap:14px;}
  .field-row .field{flex:1;}

  .note-box{
    background:var(--sage-100);
    border-left:3px solid var(--moss-500);
    padding:12px 14px;
    border-radius:6px;
    font-size:13px;
    color:var(--forest-800);
    margin-bottom:16px;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 22px;
    border-radius:8px;
    border:none;
    font-size:14.5px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:transform .08s ease, box-shadow .12s ease;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--forest-800); color:var(--paper);}
  .btn-primary:hover{background:var(--forest-700);}
  .btn-ghost{background:transparent; color:var(--forest-800); border:1px solid var(--line);}
  .btn-ghost:hover{background:var(--sage-100);}
  .btn-row{display:flex; gap:12px; margin-top:18px; flex-wrap:wrap;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}

  /* ---------- WIZARD ---------- */
  .progress-wrap{margin-bottom:22px;}
  .progress-meta{
    display:flex; justify-content:space-between; align-items:baseline;
    font-size:12.5px; color:var(--ink-soft); margin-bottom:6px;
  }
  .progress-meta b{color:var(--forest-800); font-weight:700;}
  .progress-track{
    height:8px; background:var(--sage-100); border-radius:99px; overflow:hidden;
  }
  .progress-fill{
    height:100%; background:linear-gradient(90deg,var(--moss-500),var(--forest-800));
    border-radius:99px; transition:width .25s ease;
  }
  .module-pills{
    display:flex; flex-wrap:wrap; gap:6px; margin-top:12px;
  }
  .pill{
    font-size:11.5px; padding:4px 10px; border-radius:99px;
    border:1px solid var(--line); color:var(--ink-soft);
    background:var(--paper); cursor:pointer;
  }
  .pill.active{background:var(--forest-800); color:var(--paper); border-color:var(--forest-800);}
  .pill.done{border-color:var(--moss-500); color:var(--moss-500);}

  .q-card{position:relative;}
  .q-code{
    font-size:11.5px; letter-spacing:0.03em; color:var(--moss-500);
    font-weight:700; margin-bottom:8px;
  }
  .q-text{
    font-size:19px; font-family:'Lato',sans-serif; color:var(--forest-900);
    line-height:1.4; margin-bottom:20px;
  }

  .choice-grid{display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:18px;}
  .choice{
    display:flex; align-items:flex-start; gap:12px;
    border:1.5px solid var(--line); border-radius:8px; padding:13px 15px;
    cursor:pointer; text-align:left; background:var(--paper);
    font-family:inherit; font-size:14px; color:var(--ink);
  }
  .choice .dot{
    width:16px; height:16px; border-radius:50%; flex:none; margin-top:2px;
    border:2px solid var(--line);
  }
  .choice:hover{border-color:var(--moss-500);}
  .choice.selected{border-color:var(--forest-800); background:var(--sage-100);}
  .choice.selected .dot{border-color:var(--forest-800);}
  .choice b{font-weight:700; margin-right:4px;}
  .choice small{display:block; color:var(--ink-soft); font-weight:400; margin-top:2px;}

  .c0 .dot{background:var(--red);}
  .c1 .dot{background:var(--orange);}
  .c2 .dot{background:var(--yellow);}
  .c3 .dot{background:var(--green);}
  .choice.selected.c0{background:#f6e6e3;}
  .choice.selected.c1{background:#f7ead9;}
  .choice.selected.c2{background:#f7f0d6;}
  .choice.selected.c3{background:#e3ede3;}

  textarea{
    width:100%; min-height:64px; border:1px solid var(--line); border-radius:6px;
    padding:10px 11px; font-family:inherit; font-size:13.5px; background:var(--parchment);
    resize:vertical; color:var(--ink);
  }
  .ev-label{font-size:12px; color:var(--ink-soft); font-weight:600; margin-bottom:6px; display:block;}

  .nav-row{display:flex; justify-content:space-between; margin-top:22px; gap:10px;}

  /* ---------- RESULTS / PANEL DE CONTROL ---------- */
  .score-hero{
    background:var(--forest-800); color:var(--paper); border-radius:var(--radius);
    padding:30px 28px; display:flex; align-items:center; gap:28px; flex-wrap:wrap;
    margin-bottom:22px;
  }
  .score-ring{
    width:110px; height:110px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; flex:none;
    background:conic-gradient(var(--gold) calc(var(--pct)*1%), rgba(255,255,255,0.15) 0);
  }
  .score-ring-inner{
    width:86px; height:86px; border-radius:50%; background:var(--forest-800);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .score-ring-inner b{font-family:'Lato',sans-serif; font-size:24px;}
  .score-ring-inner span{font-size:10.5px; color:var(--sage-100);}
  .score-hero-text h2{color:var(--paper); font-size:20px;}
  .score-hero-text p{color:var(--sage-100); font-size:13.5px; margin-top:6px; max-width:44ch;}
  .level-tag{
    display:inline-block; margin-top:10px; padding:5px 12px; border-radius:99px;
    font-size:12.5px; font-weight:700; background:rgba(255,255,255,0.12); color:var(--paper);
  }

  .module-row{
    display:grid; grid-template-columns:1fr 90px 90px; gap:12px; align-items:center;
    padding:12px 0; border-bottom:1px solid var(--line);
  }
  .module-row:last-child{border-bottom:none;}
  .module-name{font-size:13.5px; font-weight:600; color:var(--forest-900);}
  .module-sub{font-size:11.5px; color:var(--ink-soft); margin-top:2px;}
  .bar-track{height:9px; background:var(--sage-100); border-radius:99px; overflow:hidden; display:flex;}
  .bar-fill{height:100%;}
  .module-pct{font-size:12.5px; font-weight:700; text-align:right; color:var(--forest-800);}

  .actions-row{display:flex; gap:12px; margin-top:22px; flex-wrap:wrap;}

  footer{
    text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:40px;
  }

  @media print{
    .no-print{display:none !important;}
    body{background:#fff;}
    .card, .score-hero{box-shadow:none; border:1px solid #ccc;}
  }

  @media (max-width:560px){
    .field-row{flex-direction:column;}
    .module-row{grid-template-columns:1fr; row-gap:6px;}
    .module-pct{text-align:left;}
  }

  /* ---------- Versión 2.0: componentes nuevos ---------- */
  :focus-visible{outline:2px solid var(--moss-500); outline-offset:2px;}
  .muted{color:var(--ink-soft); font-size:13px; margin:0 0 10px;}
  .body{font-size:13.5px; line-height:1.6; margin:0 0 10px;}
  .scroll-x{overflow-x:auto;}
  .resume-card{border-left:4px solid var(--gold);}

  details.method{border-top:1px solid var(--line); padding:10px 0;}
  details.method:last-child{padding-bottom:0;}
  details.method summary{cursor:pointer; font-weight:700; color:var(--forest-800); font-size:14px;}
  details.method p{font-size:13px; line-height:1.6; margin:10px 0 0;}
  .gloss-list{margin:10px 0 0; font-size:13px;}
  .gloss-list dt{font-weight:700; color:var(--forest-900); margin-top:8px;}
  .gloss-list dd{margin:2px 0 0; color:var(--ink-soft);}

  .mode-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px;}
  .mode{border:1.5px solid var(--line); border-radius:8px; padding:14px 16px; background:var(--paper); text-align:left; cursor:pointer; font-family:inherit; color:var(--ink);}
  .mode b{display:block; font-size:15px; color:var(--forest-900); margin-bottom:4px;}
  .mode span{font-size:12.5px; color:var(--ink-soft); line-height:1.45;}
  .mode.selected{border-color:var(--forest-800); background:var(--sage-100); box-shadow:inset 0 0 0 1px var(--forest-800);}

  .q-code{display:flex; flex-wrap:wrap; gap:4px 12px; justify-content:space-between;}
  .q-num{color:var(--ink-soft); font-weight:600;}
  .term{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:help; border-bottom:2px dotted var(--forest-800);}
  .term:hover{background:var(--sage-100);}
  .gloss-box{background:#fff8e6; border-left:3px solid var(--gold); border-radius:6px; padding:10px 12px; font-size:13px; margin:-8px 0 16px;}
  .scale-hint{font-size:12px; color:var(--ink-soft); margin-bottom:8px;}
  .choice{position:relative;}
  .choice small{font-size:12.5px;}
  .choice kbd{margin-left:auto; font-family:inherit; font-size:11px; color:var(--ink-soft); border:1px solid var(--line); border-radius:4px; padding:0 5px; align-self:center;}
  .cna .dot{background:#b9c3c1;}
  .choice.selected.cna{background:#eef1f0;}
  #na-box{margin-bottom:14px;}
  .ev-grid{margin-top:14px;}
  .ev-grid .field select{width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:6px; font-size:14px; font-family:inherit; background:var(--parchment); color:var(--ink);}
  .chk-wrap{margin:4px 0 6px;}
  fieldset.chk{border:1px solid var(--line); border-radius:8px; padding:8px 12px 10px; margin:8px 0 0;}
  fieldset.chk legend{font-size:12px; font-weight:700; color:var(--forest-800); padding:0 4px;}
  fieldset.chk label{display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:3px 0; cursor:pointer;}
  .warn{background:#fdf0ec; border-left:3px solid var(--red); border-radius:6px; padding:10px 12px; font-size:13px; color:#7a2a2b; margin:12px 0;}
  .refs{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px;}
  .chip{font-size:11.5px; padding:3px 9px; border-radius:99px; background:var(--sage-100); color:var(--forest-900);}
  .chip-req{background:#dff3ee; color:var(--forest-900); box-shadow:inset 0 0 0 1px var(--moss-500);}
  .chip-vol{background:#fff6dc; color:#6b4f00;}
  .chip-bp, .chip-int{background:#eef1f0; color:var(--ink-soft);}
  .chips{display:flex; flex-wrap:wrap; gap:6px;}
  .nav-row{display:flex; justify-content:space-between; gap:12px; margin-top:18px; flex-wrap:wrap;}

  .profile{display:grid; grid-template-columns:260px 1fr; gap:18px; align-items:center;}
  .radar{width:100%; height:auto;}
  .rd-ring{fill:none; stroke:var(--line); stroke-width:1;}
  .rd-axis{stroke:var(--line); stroke-width:1;}
  .rd-label{font-size:12px; font-weight:700; fill:var(--forest-900); font-family:'Lato',sans-serif;}
  .rd-cur{fill:rgba(8,184,156,0.28); stroke:var(--forest-800); stroke-width:2;}
  .rd-prev{fill:none; stroke:var(--gold); stroke-width:2; stroke-dasharray:5 4;}
  .legend{font-size:12px; color:var(--ink-soft); display:flex; align-items:center; gap:6px; justify-content:center;}
  .lg{display:inline-block; width:16px; height:3px; margin-left:8px;}
  .lg.cur{background:var(--forest-800);}
  .lg.prev{background:var(--gold);}
  .mod-rows .module-row{grid-template-columns:1fr 80px 70px;}
  .linklike{background:none; border:none; padding:0; font:inherit; text-align:left; cursor:pointer;}
  .linklike:hover{text-decoration:underline;}
  .delta{display:block; font-size:11px; font-weight:700; color:var(--ink-soft);}
  .delta.up{color:var(--green);}
  .delta.down{color:var(--red);}
  .bar-track.wide{height:10px; margin-top:6px;}

  .road-step{border-left:3px solid var(--forest-800); padding:2px 0 2px 14px; margin-top:16px;}
  .road-step h3{font-size:14.5px; margin-bottom:6px;}
  .gap-list{margin:0; padding-left:18px; font-size:13.5px; line-height:1.5;}
  .gap-list li{margin:5px 0;}
  .gap-code{font-weight:700; color:var(--forest-800); margin-right:4px;}
  h3.sub{font-size:14px; margin:12px 0 8px;}
  .consent{display:flex; gap:10px; align-items:flex-start; font-size:13px; margin-bottom:6px; cursor:pointer;}

  /* ---------- Versión 2.1: perfil vigilada / no vigilada y conceptos básicos ---------- */
  .chip-fund{background:#e7edf9; color:#23407a; box-shadow:inset 0 0 0 1px #9fb2dc;}
  details.method ol, details.method ul{font-size:13px; line-height:1.6; margin:10px 0 0; padding-left:22px;}
  details.method li{margin:4px 0;}
  details.method .module-table{margin-top:10px; font-size:13px;}
  details.method .module-table td, details.method .module-table th{vertical-align:top; text-align:left !important;}
  .src{font-size:12px; color:var(--ink-soft); font-style:italic; margin-top:10px !important;}
  .hint{font-size:12px; color:var(--ink-soft); margin-top:5px; line-height:1.45;}
  .profile-tag{display:inline-block; font-size:12px; font-weight:700; padding:3px 10px; border-radius:99px; background:rgba(255,255,255,0.16); color:#fff; margin-top:14px;}
  .ruta{display:grid; grid-template-columns:repeat(3, 1fr); gap:12px; margin-top:10px;}
  .ruta-col{border:1px solid var(--line); border-radius:8px; overflow:hidden; background:var(--paper);}
  .ruta-head{padding:10px 14px; color:#fff;}
  .ruta-head b{display:block; font-size:14px;}
  .ruta-head span{font-size:12px; opacity:0.9;}
  .ruta-col.n1 .ruta-head{background:var(--forest-800);}
  .ruta-col.n2 .ruta-head{background:var(--moss-500);}
  .ruta-col.n3 .ruta-head{background:var(--forest-900);}
  .ruta-col ul{list-style:none; margin:0; padding:6px 14px 10px;}
  .ruta-col li{display:flex; gap:8px; align-items:flex-start; font-size:13px; line-height:1.4; padding:6px 0; border-top:1px solid var(--line);}
  .ruta-col li:first-child{border-top:none;}
  .ruta-col li .st{flex:none; width:10px; height:10px; border-radius:50%; margin-top:4px; background:#c9d2d0;}
  .ruta-col li .st.ok{background:var(--green);}
  .ruta-col li .st.dev{background:var(--yellow);}
  .ruta-col li .st.no{background:var(--red);}
  .ruta-col li small{display:block; color:var(--ink-soft); font-size:11.5px;}
  .ruta-legend{display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--ink-soft); margin-top:10px;}
  .ruta-legend i{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:5px; vertical-align:-1px;}

  /* ---------- Formato ancho y tamaño ajustable ---------- */
  #app{
    max-width:min(1240px, calc(94vw / var(--ui-zoom, 1)));
    padding:28px clamp(14px, 3vw, 40px) 80px;
    zoom:var(--ui-zoom, 1);
  }
  .brand-right{display:flex; align-items:center; gap:14px;}
  .zoom{display:flex; gap:4px;}
  .zoom button{font-family:inherit; font-size:13px; font-weight:700; color:#fff; background:transparent; border:1px solid rgba(255,255,255,0.55); border-radius:6px; padding:3px 9px; cursor:pointer; line-height:1.2;}
  .zoom button:hover{background:rgba(255,255,255,0.15);}
  @media (min-width:1000px){
    body{font-size:16px;}
    .card{padding:30px 38px;}
    .card h2{font-size:21px;}
    .intro-hero{padding:48px 46px;}
    .intro-hero h1{max-width:none;}
    .intro-hero p{max-width:80ch; font-size:16.5px;}
    .body, details.method p, details.method ol, details.method ul, .gap-list, .gloss-list, .note-box, .warn{font-size:15px;}
    details.method .module-table{font-size:14px;}
    .ruta-col li{font-size:14px;}

const ZOOM_KEY = "saras_ui_zoom";
const ZOOM_STEPS = [0.85, 0.9, 1, 1.1, 1.2, 1.3, 1.4];
let uiZoom = 1;
try{ const z = parseFloat(localStorage.getItem(ZOOM_KEY)); if(ZOOM_STEPS.includes(z)) uiZoom = z; }catch(e){}
function applyZoom(){ document.documentElement.style.setProperty('--ui-zoom', uiZoom); }
function setZoom(dir){
  const i = ZOOM_STEPS.indexOf(uiZoom);
  uiZoom = ZOOM_STEPS[Math.min(ZOOM_STEPS.length - 1, Math.max(0, i + dir))];
  applyZoom();
  try{ localStorage.setItem(ZOOM_KEY, String(uiZoom)); }catch(e){}
}
applyZoom();

/* ---------- Guardado automático ---------- */
function persist(){
  try{
    localStorage.setItem(STORAGE_KEY, JSON.stringify({version:TOOL_VERSION, mode:state.mode, institution:state.institution, answers:state.answers, pos:state.pos, savedAt:new Date().toISOString()}));
  }catch(e){ /* almacenamiento no disponible: la herramienta sigue funcionando */ }
}
function loadSaved(){
  try{ const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
}
function clearSaved(){ try{ localStorage.removeItem(STORAGE_KEY); }catch(e){} }

/* ---------- Perfil: entidad vigilada o no vigilada por la SFC ---------- */
function NV(){ return state.institution.vig === "No"; }
function perfilOK(q){
  if(q.perfil === "vig") return !NV();   // sin respuesta se trata como vigilada
  if(q.perfil === "nov") return NV();
  return true;
}
function isExpress(q){ return NV() && q.expressNV !== undefined ? q.expressNV : q.express; }
function inMode(q, mode){ return (mode === "completo" || isExpress(q)) && perfilOK(q); }
function nQs(mode){ return activeQs(mode).length; }
// Textos, acciones, referencias y horizontes según el perfil
function qText(q){ return NV() && q.qNV ? q.qNV : q.q; }
function qAccion(q){ return NV() && q.accionNV ? q.accionNV : q.accion; }
function qRefs(q){ return NV() && q.refsNV ? q.refsNV : q.refs; }
function qH(q){ return NV() && q.hNV ? q.hNV : q.h; }
function dimT(q){ return NV() && q.dimTitleNV ? q.dimTitleNV : q.dimTitle; }
function modDesc(m){ return NV() && m.descNV ? m.descNV : m.desc; }
function qModDesc(q){ return NV() && q.moduleDescNV ? q.moduleDescNV : q.moduleDesc; }
function levelSub(lv){ return NV() && LEVELS[lv].subNV ? LEVELS[lv].subNV : LEVELS[lv].sub; }
function modLevel(code, lv){ return (NV() && MODULE_LEVELS_NV[code] ? MODULE_LEVELS_NV[code] : MODULE_LEVELS[code])[lv]; }

  const a = {};
  Object.keys(p.answers || {}).forEach(k => { a[V20_MAP[k] || k] = p.answers[k]; });
  p.answers = a;
  if(p.pos) p.pos = V20_MAP[p.pos] || p.pos;
  if(p.institution && p.institution.tipo === "ONG o fundación microfinanciera") p.institution.tipo = "ONG, fundación o corporación microfinanciera";
  p.version = TOOL_VERSION;
  return p;
}
function activeQs(mode){ return FLAT.filter(q => inMode(q, mode || state.mode)); }

function isDerived(q, ans){
  ans = ans || state.answers;
  if(!q.dep) return false;
  const parent = BYCODE[q.dep.code];
  if(isDerived(parent, ans)) return true;
  const a = ans[parent.code];
  return !!a && a.v === q.dep.when;
}
// Devuelve null (sin responder), "na" o un valor entre 0 y 1
function scoreOf(q, ans){
  ans = ans || state.answers;
  if(isDerived(q, ans)) return 0;
  const a = ans[q.code];
  if(!a || a.v === undefined || a.v === null) return null;
  if(a.v === "na") return "na";
  return q.t === "bin" ? a.v : a.v/3;
}
function levelIdx(p){ return p>=THRESHOLDS[2] ? 3 : p>=THRESHOLDS[1] ? 2 : p>=THRESHOLDS[0] ? 1 : 0; }

function moduleStats(mi, ans, mode){
  const qs = activeQs(mode).filter(q => q.mi === mi);
  let answered=0, na=0, sum=0, derived=0;
  qs.forEach(q => {
    const s = scoreOf(q, ans);
    if(s === null) return;
    if(s === "na"){ na++; return; }
    answered++; sum += s;
    if(isDerived(q, ans)) derived++;
  });
  const n = qs.length;
  const coverage = n ? (answered+na)/n : 0;
  return {n, answered, na, derived, pct: answered ? sum/answered : 0, coverage, determined: n>0 && answered>0 && coverage >= MIN_COVERAGE};
}
function globalStats(ans, mode){
  let wsum=0, psum=0, n=0, done=0;
  const mods = MODULES.map((m, mi) => {
    const s = moduleStats(mi, ans, mode);
    n += s.n; done += s.answered + s.na;
    if(s.answered>0){ const w = MODULE_WEIGHTS[m.code] ?? 1; wsum += w; psum += w*s.pct; }
    return s;
  });
  const coverage = n ? done/n : 0;
  return {pct: wsum ? psum/wsum : 0, coverage, determined: coverage >= MIN_COVERAGE && wsum>0, done, n, mods};
}

/* ---------- Navegación ---------- */
function navList(){ return activeQs().filter(q => !isDerived(q)); }
function firstOfModule(mi){ return navList().find(q => q.mi === mi); }
function currentQ(){ return BYCODE[state.pos]; }

function validateCurrent(){
  const q = currentQ(); if(!q) return true;
  const a = state.answers[q.code];
  if(a && a.v === "na" && !(a.just||"").trim()){
    state.notice = "Escriba la justificación de «No aplica» antes de continuar.";
    render(); return false;
  }
  return true;
}
function goNext(){
  syncFields();
  if(!validateCurrent()) return;
  const list = navList();
  const i = list.findIndex(q => q.code === state.pos);
  const q = list[i];
  const next = list[i+1];
  if(!next || next.mi !== q.mi){ state.modResults = q.mi; state.screen = "moduleresults"; }
  else state.pos = next.code;
  state.notice = "";
  render(); window.scrollTo(0,0);
}
function goPrev(){
  syncFields();
  const list = navList();
  const i = list.findIndex(q => q.code === state.pos);
  if(i > 0){ state.pos = list[i-1].code; state.notice=""; render(); window.scrollTo(0,0); }
}
function ensureAnswer(code){
  if(!state.answers[code]) state.answers[code] = {v:null, just:"", soporte:"", obs:"", check:[]};
  return state.answers[code];
}
function syncFields(){
  const q = currentQ(); if(!q || state.screen !== "wizard") return;
  const a = ensureAnswer(q.code);
  const obs = document.getElementById('f-obs'); if(obs) a.obs = obs.value;
  const sop = document.getElementById('f-soporte'); if(sop) a.soporte = sop.value;
  const just = document.getElementById('f-just'); if(just) a.just = just.value;
  const checks = document.querySelectorAll('.chk input');
  if(checks.length) a.check = [...checks].filter(c => c.checked).map(c => c.value);
}

function refKind(r){

  if(r === FUND_REF) return "fund";
  return r === "Buena práctica" ? "bp" : "int";
}

function refTitle(r){ return ({req:"Requisito del Capítulo XXXIII para entidades vigiladas", vol:"Referencia voluntaria", fund:"Requisito habitual en los contratos de fondeo", bp:"Buena práctica", int:"Marco internacional o buena práctica"})[refKind(r)]; }

/* ---------- Glosario ---------- */
function withGlossary(text){
  let out = esc(text);
  const hits = [];
  GLOSSARY.forEach((g, i) => {
    const re = new RegExp("(^|[^\\wÁÉÍÓÚÑáéíóúñ\\u0001-\\u0003])(" + g.re + ")(?![\\wÁÉÍÓÚÑáéíóúñ])", g.cs ? "" : "i");
    // no marcar dentro de un término ya marcado
    const parts = out.split(/(\u0001\d+\u0002[^\u0003]*\u0003)/);
    let done = false;
    for(let p=0; p<parts.length && !done; p+=2){
      if(re.test(parts[p])){ parts[p] = parts[p].replace(re, (m, pre, w) => pre + "\u0001" + i + "\u0002" + w + "\u0003"); done = true; }
    }
    out = parts.join("");
  });
  return out.replace(/\u0001(\d+)\u0002([^\u0003]*)\u0003/g, (m, i, w) => `<button type="button" class="term" data-term="${i}" aria-label="Definición de ${esc(GLOSSARY[i].k)}">${w}</button>`);
}

      <details class="method">
        <summary>Ver la metodología</summary>
        <p><b>Dos tipos de pregunta.</b> Las preguntas de existencia se responden con <i>Sí</i>, <i>Parcialmente</i> o <i>No</i> (equivalentes a 100 %, 50 % y 0 %). Las preguntas de práctica se responden en una escala de 0 a 3: <i>Inexistente</i>, <i>Inicial</i>, <i>Establecido</i> u <i>Optimizado</i> (0 %, 33 %, 67 % y 100 %).</p>
        <p><b>No aplica.</b> Puede marcarse cuando la práctica no corresponde al modelo de negocio de la entidad. Exige una justificación y se excluye del cálculo.</p>
        <p><b>Preguntas derivadas.</b> Algunas preguntas dependen de otra. Por ejemplo, si la entidad no cuenta con política (POL-1 = No), las preguntas sobre el contenido de la política se registran automáticamente como <i>No</i> y no se muestran.</p>
        <p><b>Cobertura mínima.</b> El nivel de madurez de cada módulo y el nivel global solo se asignan cuando se ha respondido al menos el ${Math.round(MIN_COVERAGE*100)} % de las preguntas correspondientes.</p>
        <p><b>Resultado global.</b> Es el promedio de los módulos, todos con el mismo peso. Los niveles se asignan así: menos de ${Math.round(THRESHOLDS[0]*100)} %, Incipiente; desde ${Math.round(THRESHOLDS[0]*100)} %, Básico; desde ${Math.round(THRESHOLDS[1]*100)} %, Estructurado; desde ${Math.round(THRESHOLDS[2]*100)} %, Avanzado.</p>
        <p><b>Referencias.</b> Los numerales citados corresponden al Capítulo XXXIII de la Circular Básica Contable y Financiera, adicionado por la Circular Externa 015 de 2025. Se distinguen cuatro tipos de etiqueta: requisito del Capítulo XXXIII (solo para entidades vigiladas), referencia voluntaria del mismo Capítulo (por ejemplo, los indicadores del Anexo 1), requisitos habituales de los fondeadores y marcos internacionales o buenas prácticas, como las Normas de Desempeño de IFC, la Nota de orientación de IFC para intermediarios financieros (2023), la guía de gestión ambiental y social de FMO para instituciones microfinancieras, la Guía SARAS del BID, los Estándares Universales de Gestión del Desempeño Social y Ambiental de SPTF y Cerise, TCFD, TNFD, la Taxonomía Verde de Colombia o la Ley 1328 de 2009. La etiqueta «Taller SARAS para IMF (2026)» corresponde al Taller SARAS para instituciones microfinancieras de Asomicrofinanzas, BID Invest, Finance in Motion y Kawsay Consultores.</p>
        <p><b>Entidades no vigiladas por la SFC.</b> Si la entidad indica que no es vigilada por la Superintendencia Financiera: (i) no se muestran las preguntas del régimen de transición, del filtro inicial y de los reportes semestrales del Capítulo XXXIII, ni las de definición como establecimiento de crédito y de reasentamiento involuntario; (ii) se muestran en su lugar preguntas sobre el universo y los criterios de alcance del SARAS, el reporte anual a la Junta Directiva y a los fondeadores, y las obligaciones de los contratos de fondeo; (iii) algunas preguntas se redactan sin la terminología de la supervisión, y (iv) todos los numerales del Capítulo XXXIII se marcan como referencia voluntaria. El módulo de Gestión de Riesgos del Portafolio corresponde para ellas a una etapa posterior y voluntaria, y sus acciones principales se ubican a partir del segundo horizonte de la hoja de ruta.</p>
      </details>
      <details class="method">
        <summary>Ver el glosario</summary>
        <dl class="gloss-list">${GLOSSARY.map(g => `<dt>${esc(g.k)}</dt><dd>${esc(nv && g.dNV ? g.dNV : g.d)}</dd>`).join("")}</dl>
      </details>
    </div>`));

  const card = el(`
    <div class="card">
      <h2>Iniciar un diagnóstico</h2>
      <div class="mode-grid" role="radiogroup" aria-label="Tipo de diagnóstico">
        <button type="button" class="mode ${state.mode==='express'?'selected':''}" data-mode="express" role="radio" aria-checked="${state.mode==='express'}">
          <b>Diagnóstico rápido</b><span>${nQs("express")} preguntas clave, unos 10 minutos. Ofrece una primera lectura indicativa.</span>
        </button>
        <button type="button" class="mode ${state.mode==='completo'?'selected':''}" data-mode="completo" role="radio" aria-checked="${state.mode==='completo'}">
          <b>Diagnóstico completo</b><span>${nQs("completo")} preguntas, alrededor de una hora; puede completarse en varias sesiones. Genera la hoja de ruta detallada.</span>
        </button>
      </div>
      <div class="field">
        <label for="f-nombre">Nombre de la institución financiera</label>
        <input id="f-nombre" type="text" value="${esc(state.institution.nombre)}" placeholder="Ej. Financiera Ejemplo S.A.">

      <div class="field-row">

          <label for="f-tipo">Tipo de institución</label>
          <select id="f-tipo">
            <option value="">Seleccione…</option>
            ${TIPOS.map(t => `<option ${state.institution.tipo===t?"selected":""}>${t}</option>`).join("")}
          </select>
        </div>
        <div class="field">
          <label for="f-vig">¿La entidad es vigilada por la Superintendencia Financiera?</label>
          <select id="f-vig">
            <option value="">Seleccione…</option>
            ${["Sí","No"].map(t => `<option ${state.institution.vig===t?"selected":""}>${t}</option>`).join("")}
          </select>
          <div class="hint">Obligatorio: define el cuestionario. Bancos, compañías de financiamiento y cooperativas financieras son vigiladas; las ONG, fundaciones, corporaciones y cooperativas de ahorro y crédito, no. Confirme el régimen de su entidad.</div>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="f-fecha">Fecha de diligenciamiento</label>
          <input id="f-fecha" type="date" value="${esc(state.institution.fecha)}">
        </div>
      </div>

        <div class="field">
          <label for="f-resp">Persona responsable</label>
          <input id="f-resp" type="text" value="${esc(state.institution.responsable)}" placeholder="Nombre completo">
        </div>
        <div class="field">

          <input id="f-cargo" type="text" value="${esc(state.institution.cargo)}" placeholder="Ej. Oficial de Riesgos">
        </div>
      </div>
      <div class="note-box">Las respuestas se guardan automáticamente en este navegador. Solo salen de él si usted descarga el archivo de resultados o pulsa «Enviar resultados a GGGI» y acepta el aviso de tratamiento de datos.</div>
      ${state.notice ? `<div class="warn" role="alert">${esc(state.notice)}</div>` : ""}
      <div class="btn-row">
        <button class="btn btn-primary" id="btn-start">Comenzar el diagnóstico</button>
        <label class="btn btn-ghost" style="cursor:pointer;">Cargar un archivo guardado
          <input type="file" id="file-load" accept="application/json" style="display:none;">
        </label>
      </div>
    </div>`);
  wrap.appendChild(card);

  setTimeout(() => {
    if(!document.body.contains(card)) return;
    const keep = (fn) => { const y = window.scrollY; fn(); render(); window.scrollTo(0, y); };
    card.querySelectorAll('.mode').forEach(b => b.onclick = () => keep(() => { readInstitution(); state.mode = b.dataset.mode; }));
    document.getElementById('f-tipo').onchange = () => keep(() => {
      readInstitution();
      const sug = TIPO_VIG[state.institution.tipo];
      if(sug) state.institution.vig = sug;
      state.notice = "";
    });
    document.getElementById('f-vig').onchange = () => keep(() => { readInstitution(); state.notice = ""; });
    document.getElementById('btn-start').onclick = () => {
      readInstitution();
      if(!state.institution.vig){
        state.notice = "Indique si la entidad es vigilada por la Superintendencia Financiera: de esa respuesta depende el cuestionario.";
        keep(() => {}); return;
      }
      state.notice = "";
      state.pos = navList()[0].code; state.screen = "wizard"; render(); window.scrollTo(0,0);
    };
    document.getElementById('file-load').onchange = (e) => {
      const file = e.target.files[0]; if(!file) return;
      const r = new FileReader();
      r.onload = ev => {
        try{
          const p = migrate(JSON.parse(ev.target.result));
          if(!p.answers) throw new Error();
          state.institution = p.institution || state.institution;
          state.answers = p.answers; state.mode = p.mode || "completo";
          state.pos = navList()[0].code; state.screen = "wizard"; render();
        }catch(err){ alert("No se pudo leer el archivo. Verifique que sea un JSON exportado desde la versión 2.0 o 2.1 de esta herramienta."); }
      };
      r.readAsText(file);
    };
  }, 0);
  return wrap;
}

  wrap.appendChild(el(`
    <div class="progress-wrap no-print">

      </div>

      cd.appendChild(b);

    card.querySelectorAll('.chk input').forEach(c => c.onchange = () => { syncFields(); persist(); });

    document.onkeydown = (e) => {
      if(state.screen !== "wizard") return;

      else if(e.key === "ArrowLeft"){ const b = document.getElementById('btn-prev'); if(b && !b.disabled) b.click(); }
    };
  }, 0);
  return wrap;
}

function heroBg(p){ return ["#c0454a", "#c97a2e", "#b8841c", "#2f6b59"][levelIdx(p)]; }
function barColor(p){ return ["var(--red)","var(--orange)","var(--yellow)","var(--green)"][levelIdx(p)]; }

function gapsFor(filterFn){
  return activeQs().filter(q => {
    if(!filterFn(q) || isDerived(q)) return false;
    const s = scoreOf(q);
    return s !== null && s !== "na" && s <= 0.5;
  });
}
function answerLabel(q){
  if(isDerived(q)) return "No (derivada)";
  const a = state.answers[q.code]; if(!a || a.v===null || a.v===undefined) return "Sin responder";
  if(a.v === "na") return "No aplica";
  return (q.t === "bin" ? BIN_OPTS : MAD_OPTS).find(o => o.v === a.v).label;
}

function radarSVG(cur, prev){
  const N = MODULES.length, cx = 170, cy = 150, R = 105;
  const pt = (i, r) => { const ang = -Math.PI/2 + i*2*Math.PI/N; return [cx + r*Math.cos(ang), cy + r*Math.sin(ang)]; };
  let rings = "";
  [0.33, 0.67, 1].forEach(f => { rings += `<polygon points="${MODULES.map((_, i) => pt(i, R*f).join(",")).join(" ")}" class="rd-ring"/>`; });
  let axes = MODULES.map((m, i) => { const [x,y] = pt(i, R); const [lx,ly] = pt(i, R+22); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" class="rd-axis"/><text x="${lx}" y="${ly+4}" text-anchor="middle" class="rd-label">${m.code}</text>`; }).join("");
  const poly = (vals, cls) => `<polygon points="${vals.map((v, i) => pt(i, R*Math.max(v,0.02)).join(",")).join(" ")}" class="${cls}"/>`;
  return `<svg viewBox="0 0 340 300" class="radar" role="img" aria-label="Gráfico de radar del nivel de adopción por módulo">${rings}${axes}${prev ? poly(prev, "rd-prev") : ""}${poly(cur, "rd-cur")}</svg>`;
}

        </div>
        <div class="bar-track"><div class="bar-fill" style="width:${Math.round(s.pct*100)}%; background:${barColor(s.pct)};"></div></div>
        <div class="module-pct">${pctTxt(s.pct)}${delta !== null ? `<span class="delta ${delta>0?"up":delta<0?"down":""}">${delta>0?"+":""}${delta}</span>` : ""}</div>
      </div>`);
    row.querySelector('.module-name').onclick = () => { const f = firstOfModule(mi); if(f){ state.pos = f.code; state.screen = "wizard"; render(); window.scrollTo(0,0);} };
    rows.appendChild(row);
  });

  // Ruta progresiva del SARAS (niveles de madurez)
  const rutaStatus = (code) => {
    const q = BYCODE[code];
    if(!q || !inMode(q, state.mode)) return {cls:"", txt:"No evaluado en el diagnóstico rápido"};
    const sc = scoreOf(q);
    if(sc === null) return {cls:"", txt:"Sin responder"};
    if(sc === "na") return {cls:"", txt:"No aplica"};
    if(sc >= THRESHOLDS[1]) return {cls:"ok", txt:"Implementado"};
    if(sc > 0) return {cls:"dev", txt:"En desarrollo"};
    return {cls:"no", txt:"Pendiente"};
  };
  const rutaHtml = RUTA.map((n, i) => `<div class="ruta-col n${i+1}"><div class="ruta-head"><b>${esc(n.nivel)}</b><span>${esc(n.plazo)}</span></div><ul>${n.items.map(it => {
    const code = NV() ? it.nov : it.vig; const st = rutaStatus(code);
    return `<li><span class="st ${st.cls}"></span><span>${esc(!NV() && it.tVig ? it.tVig : it.t)}<small>${code} · ${st.txt}</small></span></li>`;
  }).join("")}</ul></div>`).join("");
  wrap.appendChild(el(`
    <div class="card">
      <h2>Ruta progresiva del SARAS</h2>
      <p class="muted">Estado de los elementos que marcan cada nivel de madurez. Cada nivel ya reduce riesgo; el siguiente se alcanza cuando el anterior opera de forma estable en toda la red.</p>
      <div class="ruta">${rutaHtml}</div>
      <div class="ruta-legend"><span><i style="background:var(--green)"></i>Implementado (Sí, Establecido u Optimizado)</span><span><i style="background:var(--yellow)"></i>En desarrollo (Parcialmente o Inicial)</span><span><i style="background:var(--red)"></i>Pendiente</span><span><i style="background:#c9d2d0"></i>Sin información</span></div>
      <p class="muted" style="margin-top:10px;">Propuesta de niveles de madurez. Fuentes: Taller SARAS para microfinanzas (2026), módulo 2; FMO, S&amp;E Management Guidance for MFIs; IFC (2023), Guidance Note on FIs.</p>
    </div>`));

  // Respaldo documental
  let fav = 0, sop = 0;
  activeQs().forEach(q => { const s = scoreOf(q); if(typeof s === "number" && s >= 0.5 && !isDerived(q)){ fav++; const a = state.answers[q.code]; if(a && a.soporte) sop++; } });
  wrap.appendChild(el(`
    <div class="card">
      <h2>Respaldo documental</h2>
      <p class="body">${fav ? `${sop} de ${fav} respuestas favorables (${pctTxt(sop/fav)}) cuentan con un soporte documental identificado. Las respuestas sin soporte deben considerarse autodeclaradas.` : "Aún no hay respuestas favorables para evaluar su respaldo documental."}</p>
      ${fav ? `<div class="bar-track wide"><div class="bar-fill" style="width:${sop/fav*100}%; background:var(--moss-500);"></div></div>` : ""}
    </div>`));

  // Hoja de ruta
  const gaps = gapsFor(() => true);
  const derivedN = activeQs().filter(q => isDerived(q)).length;
  const road = [1,2,3].map(h => {
    const items = gaps.filter(q => qH(q) === h).sort((a, b) => a.mi - b.mi || scoreOf(a) - scoreOf(b));
    if(!items.length) return "";
    return `<div class="road-step"><h3>${HORIZONS[h]}</h3><ul class="gap-list">${items.map(q => `<li><span class="gap-code">${q.code}</span> ${esc(qAccion(q))} <span class="muted">(${answerLabel(q)})</span></li>`).join("")}</ul></div>`;
  }).join("");
  wrap.appendChild(el(`
    <div class="card">
      <h2>Hoja de ruta sugerida</h2>
      <p class="muted">Acciones derivadas de las respuestas No, Parcialmente, Inexistente o Inicial, ordenadas por horizonte de implementación.${derivedN ? ` Las ${derivedN} preguntas derivadas quedan cubiertas por la acción de la pregunta de la que dependen.` : ""}</p>
      ${road || `<p class="muted">No se identificaron brechas en las preguntas respondidas.</p>`}
    </div>`));

  // Brechas por marco de referencia
  const fw = {};
  activeQs().forEach(q => {
    const s = scoreOf(q); if(s === null || s === "na") return;
    qRefs(q).forEach(r => { fw[r] = fw[r] || {n:0, gap:0}; fw[r].n++; if(s <= 0.5) fw[r].gap++; });
  });
  const KORD = {fund:0, req:1, vol:2, int:3, bp:4};
  const fwRows = Object.keys(fw).sort((a, b) => (KORD[refKind(a)] - KORD[refKind(b)]) || a.localeCompare(b, "es", {numeric:true})).map(r => `<tr><td><span class="chip ${refClass(r)}" title="${refTitle(r)}">${esc(r)}</span></td><td>${fw[r].n}</td><td>${fw[r].gap}</td></tr>`).join("");
  let reqN = 0, reqGap = 0, fundN = 0, fundGap = 0;
  activeQs().forEach(q => {
    const s = scoreOf(q); if(s === null || s === "na") return;
    if(qRefs(q).some(r => refKind(r) === "req")){ reqN++; if(s <= 0.5) reqGap++; }
    if(qRefs(q).some(r => refKind(r) === "fund")){ fundN++; if(s <= 0.5) fundGap++; }
  });
  const fwHead = NV()
    ? `${fundN ? `${fundGap} de las ${fundN} preguntas evaluadas que se vinculan con requisitos habituales de los fondeadores presentan brecha.` : "Aún no hay respuestas vinculadas con requisitos habituales de los fondeadores."} Como la entidad indicó que no es vigilada por la Superintendencia Financiera, el Capítulo XXXIII de la Circular Básica Contable y Financiera no le es obligatorio: sus numerales se muestran como referencia voluntaria. Verifique en sus contratos de fondeo cuáles requisitos le son exigibles.`
    : `${reqN ? `${reqGap} de las ${reqN} preguntas evaluadas que se vinculan con requisitos del Capítulo XXXIII de la Circular Básica Contable y Financiera presentan brecha.` : "Aún no hay respuestas vinculadas con requisitos del Capítulo XXXIII."} Las referencias marcadas como voluntarias, los requisitos de fondeadores y las buenas prácticas no son exigencias regulatorias.`;
  wrap.appendChild(el(`
    <div class="card">
      <h2>Brechas por marco de referencia</h2>
      <p class="body">${fwHead}</p>
      <div class="scroll-x"><table class="module-table">
        <thead><tr><th>Referencia</th><th>Preguntas evaluadas</th><th>Con brecha</th></tr></thead>
        <tbody>${fwRows || `<tr><td colspan="3">Sin respuestas.</td></tr>`}</tbody>
      </table></div>
    </div>`));

  // Preguntas marcadas como No aplica
  const naList = activeQs().filter(q => state.answers[q.code] && state.answers[q.code].v === "na" && !isDerived(q));
  if(naList.length){
    wrap.appendChild(el(`
      <div class="card">
        <h2>Información complementaria</h2>
        ${naList.length ? `<h3 class="sub">Preguntas marcadas como No aplica</h3><ul class="gap-list">${naList.map(q => `<li><span class="gap-code">${q.code}</span> ${esc(state.answers[q.code].just || "")}</li>`).join("")}</ul>` : ""}
      </div>`));
  }

  // Acciones
  const sheets = !!SHEETS_ENDPOINT_URL;
  const actions = el(`
    <div class="card no-print">
      <h2>Guardar y compartir</h2>
      ${sheets ? `<label class="consent"><input type="checkbox" id="f-consent"> Autorizo a GGGI a tratar estas respuestas con fines de análisis agregado de la adopción de SARAS, conforme a la Ley 1581 de 2012.</label>` : ""}
      <div class="actions-row">
        ${sheets ? `<button class="btn btn-primary" id="btn-send" disabled>Enviar resultados a GGGI</button>` : ""}
        <button class="btn ${sheets ? "btn-ghost" : "btn-primary"}" id="btn-print">Imprimir o guardar en PDF</button>
        <button class="btn btn-ghost" id="btn-json">Descargar respuestas (JSON)</button>
        <button class="btn btn-ghost" id="btn-csv">Descargar tabla (CSV)</button>
        <label class="btn btn-ghost" style="cursor:pointer;">Comparar con un diagnóstico anterior
          <input type="file" id="file-prev" accept="application/json" style="display:none;">
        </label>
        ${state.mode === "express" ? `<button class="btn btn-ghost" id="btn-full">Pasar al diagnóstico completo</button>` : ""}
        <button class="btn btn-ghost" id="btn-edit">Revisar respuestas</button>
        <button class="btn btn-ghost" id="btn-home">Volver a la página principal</button>
      </div>
    </div>`);
  wrap.appendChild(actions);

  setTimeout(() => {
    document.getElementById('btn-print').onclick = () => window.print();
    document.getElementById('btn-home').onclick = goHome;
    document.getElementById('btn-json').onclick = () => download(JSON.stringify(buildPayload(), null, 2), "application/json", "json");
    document.getElementById('btn-csv').onclick = () => download("\ufeff" + buildCSV(), "text/csv;charset=utf-8", "csv");
    document.getElementById('btn-edit').onclick = () => { state.pos = navList()[0].code; state.screen = "wizard"; render(); window.scrollTo(0,0); };
    const full = document.getElementById('btn-full');
    if(full) full.onclick = () => {
      state.mode = "completo";
      const first = navList().find(q => { const s = scoreOf(q); return s === null; }) || navList()[0];
      state.pos = first.code; state.screen = "wizard"; render(); window.scrollTo(0,0);
    };
    document.getElementById('file-prev').onchange = (e) => {
      const file = e.target.files[0]; if(!file) return;
      const r = new FileReader();
      r.onload = ev => {
        try{
          const p = migrate(JSON.parse(ev.target.result)); if(!p.answers) throw new Error();
          const gs = globalStats(p.answers, state.mode);
          const d = p.institution && p.institution.fecha ? p.institution.fecha : (p.exportedAt || "").slice(0,10);
          state.prev = {label: "Anterior" + (d ? ` (${d})` : ""), pcts: gs.mods.map(s => s.pct)};
          render();
        }catch(err){ alert("No se pudo leer el archivo. Verifique que sea un JSON exportado desde la versión 2.0 o 2.1 de esta herramienta."); }
      };
      r.readAsText(file);
    };
    if(sheets){
      const c = document.getElementById('f-consent'), b = document.getElementById('btn-send');
      c.onchange = () => { b.disabled = !c.checked; };
      b.onclick = () => {
        b.disabled = true; b.textContent = "Enviando…";
        fetch(SHEETS_ENDPOINT_URL, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(buildPayload())})
          .then(r => r.json()).then(res => {
            if(res.status === "ok"){ b.textContent = "Resultados enviados"; }
            else { b.disabled = false; b.textContent = "Enviar resultados a GGGI"; alert("El envío falló: " + (res.message || "error no especificado") + ". Descargue el JSON y envíelo por correo."); }
          }).catch(() => { b.disabled = false; b.textContent = "Enviar resultados a GGGI"; alert("No hay conexión con el servidor de respuestas. Descargue el JSON y envíelo por correo."); });
      };
    }
  }, 0);
  return wrap;
}

function buildPayload(){
  const g = globalStats();
  return {
    tool: "Autodiagnóstico SARAS Microfinanzas", version: TOOL_VERSION, mode: state.mode, perfil: NV() ? "no vigilada" : "vigilada",
    institution: state.institution, answers: state.answers, exportedAt: new Date().toISOString(),
    results: {global: {pct: g.pct, coverage: g.coverage, level: g.determined ? LEVELS[levelIdx(g.pct)].label : null},
              modules: MODULES.map((m, mi) => ({code: m.code, pct: g.mods[mi].pct, coverage: g.mods[mi].coverage, level: g.mods[mi].determined ? LEVELS[levelIdx(g.mods[mi].pct)].label : null}))}
  };
}
function buildCSV(){
  const cols = ["Código","Código v2.0","Código v1","Módulo","Dimensión","Pregunta","Tipo","Respuesta","Puntaje (%)","Soporte","Observaciones","Justificación No aplica","Horizonte","Acción sugerida","Referencias"];
  const q2 = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const lines = [cols.map(q2).join(";")];
  activeQs().forEach(q => {
    const a = state.answers[q.code] || {}; const s = scoreOf(q);
    lines.push([q.code, q.v20||"", q.orig||"", qModDesc(q), dimT(q), qText(q), q.t==="bin"?"Existencia":"Práctica", answerLabel(q),
      typeof s === "number" ? Math.round(s*100) : "", a.soporte||"", a.obs||"", a.v==="na" ? a.just||"" : "",
      typeof s === "number" && s <= 0.5 && !isDerived(q) ? HORIZONS[qH(q)] : "", typeof s === "number" && s <= 0.5 && !isDerived(q) ? qAccion(q) : "", qRefs(q).join(", ")].map(q2).join(";"));
  });
  return lines.join("\r\n");
}
function download(content, type, ext){
  const blob = new Blob([content], {type}); const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url;
  a.download = "autodiagnostico_saras_microfinanzas_" + (state.institution.nombre || "institucion").replace(/[^\wÁÉÍÓÚÑáéíóúñ]+/g, "_") + "." + ext;
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
}

render();

</script>
</body>
</html>
